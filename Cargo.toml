[package]
name = "ssh-term-proto"
version = "0.1.10"
edition = "2021"
publish = false
license = "LicenseRef-Proprietary"
default-run = "shellax"

[[bin]]
name = "shellax"
path = "src/main.rs"

[[bin]]
name = "shellax-cli"
path = "src/bin/shellax-cli.rs"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = "0.3"

[target.'cfg(windows)'.dependencies]
# GUI-subsystem exe has no console: send stderr to a log file (MIT/Apache-2.0)
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Registry"] }
# `link!` lives here; windows-sys re-exports it only inside its own crate.
windows-link = "0.2"

[dependencies]
# GPUI: gpui-pre (Apache-2.0), same pin as gpui-component 0.7.3
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
alacritty_terminal = "0.26.0"
portable-pty = "0.9.0"
russh = { version = "0.64.1", default-features = false, features = ["aws-lc-rs", "flate2", "rsa"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "fs"] }
anyhow = "1"
flume = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
regex = "1"
# UI components (Apache-2.0): inputs, switches, selects for the settings view
gpui-component = "=0.7.3"
gpui-kit-assets = "=0.7.3"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = "1"
# AI: API keys in the OS keychain (Secret Service on Linux via zbus, pure Rust), encrypted-file fallback, HTTP client
keyring = { version = "3.6", features = ["async-secret-service", "tokio", "crypto-rust", "apple-native", "windows-native"] }
chacha20poly1305 = "0.10"
rand = "0.8"
ureq = { version = "2", default-features = false, features = ["tls", "json", "socks-proxy"] }
libc = "0.2"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
notify-rust = "4"
russh-sftp = "3"
getrandom = { version = "0.4", features = ["sys_rng"] }
serde_yaml = "0.9"
# Inline graphics: decode Kitty PNG payloads and build frames for gpui (MIT/Apache-2.0; already a gpui dependency)
image = { version = "0.25", default-features = false, features = ["png"] }

# Distribution build (installer payload): `cargo build --profile dist`.
# Kept separate from `release` so day-to-day release builds/tests stay fast.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "symbols"
debug = false

[dev-dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Windows cross-build: GPUI's DirectX backend precompiles HLSL only on a Windows host.
# Vendored copy (Apache-2.0, see THIRD_PARTY_NOTICES.md) adds prebuilt fxc output.
# macOS clipboard: the published gpui-pre-macos writes pasteboard text as raw UTF-8
# bytes, which other apps read as MacRoman. Vendored copy uses setString:forType:.
[patch.crates-io]
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }

# Smaller/faster debug builds: line tables only for our crate, no debuginfo for deps
# (full debuginfo made target/debug/shellax.exe ~900 MB on Windows).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1
