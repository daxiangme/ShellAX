[package]
name = "ssh-term-proto"
version = "0.1.0"
edition = "2021"
publish = false
license = "LicenseRef-Proprietary"

[dependencies]
# GPUI: gpui-pre weekly snapshot of Zed (Apache-2.0), same pin as gpui-component 0.7.3
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
alacritty_terminal = "0.26.0"
portable-pty = "0.9.0"
russh = { version = "0.64.1", default-features = false, features = ["aws-lc-rs", "flate2", "rsa"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net"] }
anyhow = "1"
flume = "0.11"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"
regex = "1"
# UI components (Apache-2.0): inputs, switches, selects for the settings view
gpui-component = "=0.7.3"
gpui-kit-assets = "=0.7.3"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = "1"
# AI: API keys in the OS keychain (Secret Service on Linux via zbus, pure Rust), encrypted-file fallback, HTTP client
keyring = { version = "3.6", features = ["async-secret-service", "tokio", "crypto-rust", "apple-native", "windows-native"] }
chacha20poly1305 = "0.10"
rand = "0.8"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
libc = "0.2"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
notify-rust = "4"
russh-sftp = "3"
getrandom = { version = "0.4", features = ["sys_rng"] }

# Distribution build (installer payload): `cargo build --profile dist`.
# Kept separate from `release` so day-to-day release builds/tests stay fast.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "symbols"
debug = false
