# 扩展包工作区：每个包编译为 wasm32-unknown-unknown 的 cdylib。
# 构建：cargo build --release --target wasm32-unknown-unknown -p <包>
[workspace]
resolver = "2"
members = ["sdk", "lang-zh", "worldtime", "image", "pdf", "pdf-render"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
shellax-ext-sdk = { path = "sdk" }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
