# Dark — original ShellAX theme. UI tokens follow system dark-mode colors; terminal
# palette approximates Terminal.app's dark profiles (blue lifted for contrast on dark background).
name = "Dark"
appearance = "dark"

[ui]
crust = "#2b2b2e"
mantle = "#262628"
base = "#1e1e1f"
surface0 = "#3a3a3c"
surface1 = "#48484a"
surface2 = "#5e5e62"
overlay0 = "#8e8e93"
overlay1 = "#98989d"
text = "#f5f5f7"
subtext = "#aeaeb2"
accent = "#0a84ff"
success = "#30d158"
error = "#ff453a"
warning = "#ff9f0a"
info = "#64d2ff"

[terminal]
foreground = "#e6e6e6"
background = "#1e1e1f"
cursor = "#bfbfbf"
cursor_text = "#1e1e1f"
selection = "#3f638b"
suggestion = "#6e6e73"
ansi = ["#000000","#c23621","#25bc24","#adad27","#4d6bff","#d338d3","#33bbc8","#cbcccd",
        "#818383","#fc391f","#31e722","#eaec23","#5c7cff","#f935f8","#14f0f0","#e9ebeb"]
