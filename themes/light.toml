# Light — original ShellAX theme. UI tokens follow system colors; terminal palette
# approximates Terminal.app's "Basic" profile (plain hex values, no third-party file used).
name = "Light"
appearance = "light"

[ui]
crust = "#e9e9eb"
mantle = "#f2f2f4"
base = "#ffffff"
surface0 = "#e8e8ed"
surface1 = "#d8d8dd"
surface2 = "#c7c7cc"
overlay0 = "#aeaeb2"
overlay1 = "#8e8e93"
text = "#1d1d1f"
subtext = "#6e6e73"
accent = "#007aff"
success = "#28a745"
error = "#ff3b30"
warning = "#ff9500"
info = "#32ade6"

[terminal]
foreground = "#000000"
background = "#ffffff"
cursor = "#7f7f7f"
cursor_text = "#ffffff"
selection = "#b4d5fe"
suggestion = "#a0a0a5"
ansi = ["#000000","#990000","#00a600","#999900","#0000b2","#b200b2","#00a6b2","#bfbfbf",
        "#666666","#e50000","#00d900","#e5e500","#0000ff","#e500e5","#00e5e5","#e5e5e5"]
