name: ext-release

# 扩展包发布：推送 ext-<id>-v<版本> 标签时构建并上传；手动触发默认只演练（dry run），不上传。
on:
  push:
    tags: ["ext-*-v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只构建并生成索引，不上传"
        type: boolean
        default: true

permissions:
  contents: write

# 多个扩展标签同时推送时依次执行，避免同时改写 ext-index。
concurrency:
  group: ext-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Test
        working-directory: extensions
        run: cargo test --release
      - name: Build wasm
        working-directory: extensions
        run: cargo build --release --target wasm32-unknown-unknown
      - name: Collect packs and index
        run: |
          set -euo pipefail
          mkdir -p dist
          REPO="${GITHUB_REPOSITORY}"
          echo '{"packs":[' > dist/index.json
          first=1
          for dir in extensions/*/; do
            name=$(basename "$dir"); [ -f "$dir/Cargo.toml" ] || continue; [ "$name" = sdk ] && continue
            id="$name"; crate=$(echo "ext_$id" | tr - _)
            ver=$(grep -m1 '^version' "$dir/Cargo.toml" | cut -d'"' -f2)
            src="extensions/target/wasm32-unknown-unknown/release/$crate.wasm"
            [ -f "$src" ] || continue
            cp "$src" "dist/$id.wasm"
            sha=$(sha256sum "dist/$id.wasm" | cut -d' ' -f1); size=$(stat -c%s "dist/$id.wasm")
            [ $first = 1 ] || echo ',' >> dist/index.json; first=0
            printf '{"id":"%s","version":"%s","size":%s,"sha256":"%s","url":"https://github.com/%s/releases/download/ext-%s-v%s/%s.wasm"}' \
              "$id" "$ver" "$size" "$sha" "$REPO" "$id" "$ver" "$id" >> dist/index.json
          done
          echo ']}' >> dist/index.json
          python3 -m json.tool dist/index.json
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: ext-packs
          path: dist/
      - name: Publish
        # 扩展包 Release 一律不标为“最新”，应用内更新检查只看 v* 正式版
        if: github.event_name == 'push' || inputs.dry_run == false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 标签推送：只发布该标签对应的包；手动触发（dry_run=false）：发布索引里全部包，缺的 Release 补建（标签不存在时在当前提交上创建）。
          if [ "${GITHUB_EVENT_NAME}" = push ]; then
            ids=$(echo "${GITHUB_REF_NAME}" | sed -E 's/^ext-(.*)-v[^-]+$/\1/')
          else
            ids=$(python3 -c "import json;print(' '.join(p['id'] for p in json.load(open('dist/index.json'))['packs']))")
          fi
          for id in $ids; do
            ver=$(python3 -c "import json,sys;print(next(p['version'] for p in json.load(open('dist/index.json'))['packs'] if p['id']==sys.argv[1]))" "$id")
            tag="ext-$id-v$ver"
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "${GITHUB_SHA}" --title "$tag" --notes "扩展包 $id $ver" --latest=false
            gh release upload "$tag" "dist/$id.wasm" --clobber
          done
          gh release view ext-index >/dev/null 2>&1 || gh release create ext-index --target "${GITHUB_SHA}" --title ext-index --notes "扩展包索引" --latest=false
          gh release upload ext-index dist/index.json --clobber
