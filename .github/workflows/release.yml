name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v0.1.11)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe')) { choco install nsis -y --no-progress }
      - name: Build and package (installer + portable zip)
        shell: pwsh
        run: pwsh -File tools\package_win.ps1 -Out dist -Makensis 'C:\Program Files (x86)\NSIS\makensis.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/ShellAX-Setup-x64.exe
            dist/ShellAX-portable-x64.zip

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --profile dist --bin shellax --bin shellax-cli
      - name: Package .app and .dmg (unsigned)
        run: |
          set -euo pipefail
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          NUM=${VER%%-*}  # 预发布后缀不进数字版本号
          APP=dist/ShellAX.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/dist/shellax target/dist/shellax-cli "$APP/Contents/MacOS/"
          if [ -f packaging/windows/agentshell-256.png ]; then
            mkdir -p icon.iconset
            for s in 16 32 128 256; do sips -z $s $s packaging/windows/agentshell-256.png --out icon.iconset/icon_${s}x${s}.png >/dev/null; done
            iconutil -c icns icon.iconset -o "$APP/Contents/Resources/ShellAX.icns" || true
          fi
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>ShellAX</string>
            <key>CFBundleDisplayName</key><string>ShellAX</string>
            <key>CFBundleIdentifier</key><string>com.daxiangme.shellax</string>
            <key>CFBundleExecutable</key><string>shellax</string>
            <key>CFBundleIconFile</key><string>ShellAX</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${NUM}</string>
            <key>CFBundleVersion</key><string>${NUM}</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          # ad-hoc 签名（无 Developer ID，不做公证）；arm64 必须有一致的签名，否则会提示"已损坏"
          xattr -cr "$APP"
          codesign --force -s - "$APP/Contents/MacOS/shellax-cli"
          codesign --force --deep -s - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # 拖拽安装布局：ShellAX.app + Applications 快捷方式
          brew install create-dmg || true
          DMG=dist/ShellAX-macos-aarch64.dmg
          STAGE=$(mktemp -d); ditto "$APP" "$STAGE/ShellAX.app"
          ok=0
          for i in 1 2 3 4 5; do
            rm -f "$DMG"
            if command -v create-dmg >/dev/null && create-dmg --volname ShellAX \
                 --window-pos 200 120 --window-size 600 380 --icon-size 110 \
                 --icon ShellAX.app 160 180 --hide-extension ShellAX.app \
                 --app-drop-link 440 180 --no-internet-enable --hdiutil-retries 10 \
                 "$DMG" "$STAGE"; then ok=1; break; fi
            echo "create-dmg 第 $i 次失败，稍后重试"; sleep 10
          done
          if [ $ok = 0 ]; then
            echo "改用 hdiutil 生成（无窗口布局）"
            ln -s /Applications "$STAGE/Applications"
            for i in 1 2 3 4 5; do
              rm -f "$DMG"
              hdiutil create -volname ShellAX -srcfolder "$STAGE" -ov -format UDZO "$DMG" && ok=1 && break
              sleep 10
            done
          fi
          [ $ok = 1 ]
          # 校验 dmg 内容
          MNT=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$MNT" "$DMG"
          ls -la "$MNT"
          test -d "$MNT/ShellAX.app" && test -L "$MNT/Applications"
          codesign --verify --deep --strict "$MNT/ShellAX.app"
          for i in 1 2 3 4 5; do hdiutil detach "$MNT" && break || sleep 5; done
          (cd dist && ditto -c -k --keepParent ShellAX.app ShellAX-macos-aarch64.zip)
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/ShellAX-macos-aarch64.dmg
            dist/ShellAX-macos-aarch64.zip

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ShellAX ${{ env.TAG }}
          prerelease: ${{ contains(env.TAG, '-beta') || contains(env.TAG, '-rc') }}
          generate_release_notes: true
          body: |
            ### 下载 / Downloads
            - Windows x64：`ShellAX-Setup-x64.exe`（安装包）或 `ShellAX-portable-x64.zip`（便携版）
            - macOS Apple Silicon：`ShellAX-macos-aarch64.dmg` 或 `.zip`

            ### 注意 / Notes
            - macOS：打开 dmg 后把 ShellAX 拖到 Applications。应用仅做 ad-hoc 签名、未公证，首次打开若提示“无法验证”，请在“应用程序”里右键 ShellAX →“打开”，或到“系统设置 → 隐私与安全性”点“仍要打开”，或执行 `xattr -dr com.apple.quarantine /Applications/ShellAX.app`。
              macOS: drag ShellAX to Applications. The app is ad-hoc signed, not notarized: on first launch right-click → Open, use System Settings → Privacy & Security → Open Anyway, or run `xattr -dr com.apple.quarantine /Applications/ShellAX.app`.
            - Windows 安装包未做代码签名，SmartScreen 可能提示“已保护你的电脑”，点“更多信息 → 仍要运行”。
              The Windows installer is unsigned; SmartScreen may warn on first run.
          files: out/*
